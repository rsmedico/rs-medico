<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.S. MEDICO | Digital Billing & Marketing</title>
<meta name="description" content="R.S. MEDICO digital billing and product marketing">
<style>
:root{--p:#1261a0;--p2:#0b3d62;--bg:#f5f7fa;--card:#fff;--text:#17202a;--muted:#667085;--line:#dfe5eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:800;font-size:22px}.tag{font-size:12px;opacity:.9}
.wrap{max-width:1100px;margin:auto;padding:18px 12px}.hero{background:linear-gradient(135deg,#eaf5ff,#fff);border-radius:18px;padding:25px;margin-bottom:16px}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{color:var(--muted);margin:5px 0 15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:0;background:#e7eef5;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:var(--p);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 4px 18px #0000000a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #cfd6dd;border-radius:9px;font-size:14px}
.section-title{font-size:19px;margin:3px 0 12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{border:1px solid var(--line);padding:6px;font-size:12px}th{background:#f0f4f8}td input{width:100%;border:0;padding:6px}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;margin:5px 5px 0 0}.primary{background:var(--p);color:#fff}.dark{background:#17202a;color:#fff}.green{background:#16a34a;color:#fff}.light{background:#e9eff5}.red{background:#ffe7e7;color:#b42318}
.totals{max-width:350px;margin:15px 0 0 auto}.totalrow{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid var(--line)}.grand{font-size:20px;font-weight:800;border-bottom:0}
.marketing{display:none}.product-card{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}.product-card h3{margin:0 0 5px}.product-card p{margin:4px 0;color:var(--muted)}
.sharebox{background:#f0fff5;border:1px solid #b9e7c8;border-radius:12px;padding:14px}
footer{text-align:center;color:var(--muted);padding:20px;font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:18px}}
@media print{header,.hero,.tabs,.no-print,footer{display:none!important}.card{border:0;box-shadow:none}.billing{display:block!important}.marketing{display:none!important}body{background:#fff}.wrap{padding:0}}
</style>
</head>
<body>

<header>
<div class="nav">
<div>
<div class="brand">R.S. MEDICO</div>
<div class="tag">Digital Billing • Professional Product Marketing</div>
</div>
<div>📱 Mobile Friendly</div>
</div>
</header>

<div class="wrap">

<section class="hero">
<h1>R.S. MEDICO Digital System</h1>
<p>पप्पांसाठी हाताने bill लिहिण्याऐवजी professional digital bill तयार करा आणि product information WhatsApp वर share करा.</p>
</section>

<div class="tabs no-print">
<button class="tab active" onclick="showTab('billing',this)">🧾 Digital Bill</button>
<button class="tab" onclick="showTab('marketing',this)">📣 Product Marketing</button>
<button class="tab" onclick="showTab('settings',this)">⚙️ Shop Settings</button>
</div>

<div class="field"><label>Date</label><input id="date" type="date"></div>
<div class="field"><label>D.L. No.</label><input id="dl" placeholder="Enter licence no."></div>
<div class="field"><label>PAN No.</label><input id="pan" placeholder="Optional"></div>
